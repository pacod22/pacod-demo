<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-labelledby="t d">
  <title id="t">pacod — open-source building blocks for AI products</title>
  <desc id="d">People and services sign in once through pacod-id, use AI products built on pacod-ap, pacod-cms and pacod-kb, and every model call goes through pacod-gw to any LLM provider.</desc>
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .h1 { font-size: 52px; font-weight: 800; fill: #f5f6fa; letter-spacing: -1px; }
      .tag { font-size: 22px; fill: #9aa3b5; }
      .cap { font-size: 13px; font-weight: 700; fill: #8b93a7; letter-spacing: 1.6px; }
      .name { font-size: 19px; font-weight: 700; fill: #f5f6fa; }
      .desc { font-size: 15px; fill: #9aa3b5; }
      .big { font-size: 20px; font-weight: 700; fill: #f5f6fa; }
      .small { font-size: 14px; fill: #9aa3b5; }
      .badge { font-size: 16px; font-weight: 800; }
      .pill { font-size: 15px; font-weight: 600; fill: #d7dbe5; }
      .foot { font-size: 16px; fill: #8b93a7; }
      .note { font-size: 17px; fill: #c9cfdb; font-style: italic; }
    </style>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5b6478"/>
    </marker>
    <marker id="av" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#a78bfa"/>
    </marker>
    <marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#2dd4bf"/>
    </marker>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#121521"/>
      <stop offset="1" stop-color="#0c0e14"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="1280" height="640" rx="24" fill="url(#bg)"/>

  <!-- header -->
  <text x="64" y="96" class="h1">pacod</text>
  <text x="64" y="134" class="tag">Open-source building blocks for AI products that you run yourself</text>

  <!-- column captions -->
  <text x="144" y="178" class="cap" text-anchor="middle">PEOPLE &amp; SERVICES</text>
  <text x="335" y="178" class="cap" text-anchor="middle">SIGN IN ONCE</text>
  <text x="610" y="178" class="cap" text-anchor="middle">YOUR AI PRODUCTS</text>
  <text x="885" y="178" class="cap" text-anchor="middle">ONE GATEWAY</text>
  <text x="1108" y="178" class="cap" text-anchor="middle">ANY MODEL</text>

  <!-- people & services -->
  <rect x="64" y="194" width="160" height="326" rx="16" fill="#171a23" stroke="#2a2f3a"/>
  <g transform="translate(144 262)" fill="none" stroke="#c9cfdb" stroke-width="3">
    <circle cx="0" cy="-12" r="13"/>
    <path d="M-24 26 Q-24 6 0 6 Q24 6 24 26"/>
  </g>
  <text x="144" y="318" class="name" text-anchor="middle">People</text>
  <g transform="translate(144 392)">
    <rect x="-26" y="-22" width="52" height="40" rx="8" fill="none" stroke="#c9cfdb" stroke-width="3"/>
    <text x="0" y="5" text-anchor="middle" style="font-size:17px;font-weight:800;fill:#c9cfdb;font-family:ui-monospace,Menlo,Consolas,monospace">&lt;/&gt;</text>
  </g>
  <text x="144" y="448" class="name" text-anchor="middle">Services</text>
  <text x="144" y="472" class="small" text-anchor="middle">apps · agents</text>

  <!-- people -> ID -->
  <line x1="226" y1="357" x2="256" y2="357" stroke="#a78bfa" stroke-width="3" marker-end="url(#av)"/>

  <!-- ID -->
  <rect x="260" y="194" width="150" height="326" rx="16" fill="#1c1630" stroke="#a78bfa" stroke-width="2"/>
  <rect x="309" y="226" width="52" height="40" rx="10" fill="#a78bfa"/>
  <text x="335" y="252" class="badge" text-anchor="middle" fill="#1c1630">ID</text>
  <text x="335" y="300" class="name" text-anchor="middle">pacod-id</text>
  <text x="335" y="346" class="big" text-anchor="middle">One sign-in</text>
  <text x="335" y="370" class="big" text-anchor="middle">for every</text>
  <text x="335" y="394" class="big" text-anchor="middle">product</text>
  <text x="335" y="446" class="small" text-anchor="middle">OpenID Connect</text>
  <text x="335" y="468" class="small" text-anchor="middle">roles · orgs</text>

  <!-- ID -> products -->
  <line x1="412" y1="243" x2="446" y2="243" stroke="#a78bfa" stroke-width="3" marker-end="url(#av)"/>
  <line x1="412" y1="357" x2="446" y2="357" stroke="#a78bfa" stroke-width="3" marker-end="url(#av)"/>
  <line x1="412" y1="471" x2="446" y2="471" stroke="#a78bfa" stroke-width="3" marker-end="url(#av)"/>

  <!-- products -->
  <g>
    <rect x="450" y="194" width="320" height="98" rx="14" fill="#151c2b" stroke="#3b82f6" stroke-opacity=".55"/>
    <rect x="468" y="221" width="48" height="44" rx="10" fill="#60a5fa"/>
    <text x="492" y="249" class="badge" text-anchor="middle" fill="#0f1117">AP</text>
    <text x="534" y="236" class="name">pacod-ap</text>
    <text x="534" y="262" class="desc">AI agents · RAG · MCP tools</text>
  </g>
  <g>
    <rect x="450" y="308" width="320" height="98" rx="14" fill="#151c2b" stroke="#3b82f6" stroke-opacity=".55"/>
    <rect x="468" y="335" width="48" height="44" rx="10" fill="#60a5fa"/>
    <text x="492" y="363" class="badge" text-anchor="middle" fill="#0f1117">CM</text>
    <text x="534" y="350" class="name">pacod-cms</text>
    <text x="534" y="376" class="desc">Editorial sites · AI translation</text>
  </g>
  <g>
    <rect x="450" y="422" width="320" height="98" rx="14" fill="#151c2b" stroke="#3b82f6" stroke-opacity=".55"/>
    <rect x="468" y="449" width="48" height="44" rx="10" fill="#60a5fa"/>
    <text x="492" y="477" class="badge" text-anchor="middle" fill="#0f1117">KB</text>
    <text x="534" y="464" class="name">pacod-kb</text>
    <text x="534" y="490" class="desc">Knowledge base · hybrid search</text>
  </g>

  <!-- products -> GW -->
  <line x1="772" y1="243" x2="806" y2="243" stroke="#2dd4bf" stroke-width="3" marker-end="url(#at)"/>
  <line x1="772" y1="357" x2="806" y2="357" stroke="#2dd4bf" stroke-width="3" marker-end="url(#at)"/>
  <line x1="772" y1="471" x2="806" y2="471" stroke="#2dd4bf" stroke-width="3" marker-end="url(#at)"/>

  <!-- GW -->
  <rect x="810" y="194" width="150" height="326" rx="16" fill="#0f2524" stroke="#2dd4bf" stroke-width="2"/>
  <rect x="859" y="226" width="52" height="40" rx="10" fill="#2dd4bf"/>
  <text x="885" y="252" class="badge" text-anchor="middle" fill="#0f2524">GW</text>
  <text x="885" y="300" class="name" text-anchor="middle">pacod-gw</text>
  <text x="885" y="346" class="big" text-anchor="middle">One gateway</text>
  <text x="885" y="370" class="big" text-anchor="middle">for every</text>
  <text x="885" y="394" class="big" text-anchor="middle">model</text>
  <text x="885" y="446" class="small" text-anchor="middle">keys · quotas</text>
  <text x="885" y="468" class="small" text-anchor="middle">cost · analytics</text>

  <!-- GW -> LLM -->
  <line x1="962" y1="357" x2="996" y2="357" stroke="#2dd4bf" stroke-width="3" marker-end="url(#at)"/>

  <!-- LLM providers -->
  <rect x="1000" y="194" width="216" height="326" rx="16" fill="#171a23" stroke="#2a2f3a"/>
  <text x="1108" y="232" class="name" text-anchor="middle">LLM providers</text>
  <rect x="1022" y="254" width="172" height="40" rx="20" fill="#1f2330" stroke="#323848"/>
  <text x="1108" y="279" class="pill" text-anchor="middle">OpenAI</text>
  <rect x="1022" y="306" width="172" height="40" rx="20" fill="#1f2330" stroke="#323848"/>
  <text x="1108" y="331" class="pill" text-anchor="middle">Anthropic</text>
  <rect x="1022" y="358" width="172" height="40" rx="20" fill="#1f2330" stroke="#323848"/>
  <text x="1108" y="383" class="pill" text-anchor="middle">Gemini</text>
  <rect x="1022" y="410" width="172" height="40" rx="20" fill="#1f2330" stroke="#323848" stroke-dasharray="5 4"/>
  <text x="1108" y="435" class="pill" text-anchor="middle">Self-hosted models</text>
  <text x="1108" y="484" class="small" text-anchor="middle">cloud or local</text>

  <!-- key message -->
  <text x="610" y="566" class="note" text-anchor="middle">Products stay simple — and never hold a provider's key.</text>

  <!-- footer -->
  <line x1="64" y1="588" x2="1216" y2="588" stroke="#232733"/>
  <text x="64" y="616" class="foot">Open source · Apache-2.0 · Self-hosted · Docker Compose &amp; Helm</text>
  <text x="1216" y="616" class="foot" text-anchor="end" style="fill:#c9cfdb;font-weight:600">ai.pacod.io</text>
</svg>
