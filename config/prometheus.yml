# The full stack's one Prometheus (pacod-prometheus). The products' scrape jobs are not repeated
# here: each repository ships its own in platform/prometheus/<product>.yml, mounted into
# /etc/prometheus/scrape.d/ (compose's platform.yml), and the products' alert and recording
# rules are mounted from where each repository keeps them. This file holds only the platform's
# own jobs: the shared components that no single product owns.
#
# Job names are the ones the products' dashboards, alerts and the gateway console select on;
# keep them.

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: pacod-demo

rule_files:
  - /etc/prometheus/rules/gw/*.yml
  - /etc/prometheus/rules/ap/*.rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["pacod-alertmanager:9093"]

scrape_config_files:
  - /etc/prometheus/scrape.d/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # The edge: Caddy's metrics for every host, on its internal :9180 listener.
  - job_name: caddy
    static_configs:
      - targets: ["pacod-caddy:9180"]

  - job_name: qdrant
    static_configs:
      - targets: ["pacod-qdrant:6333"]

  - job_name: postgres
    static_configs:
      - targets: ["pacod-postgres-exporter:9187"]

  - job_name: node
    static_configs:
      - targets: ["pacod-node-exporter:9100"]

  - job_name: cadvisor
    static_configs:
      - targets: ["pacod-cadvisor:8080"]
