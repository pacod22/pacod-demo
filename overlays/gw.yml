# Adapts pacod-gw's app file and its development overlay (../pacod-gw/deploy/docker-compose.yml,
# docker-compose.dev.yml: the image builds and the mock provider gw-mock) to the full stack:
# sign-in through the shared pacod-id (PGW_AUTH=oidc), the demo's secrets instead of the
# development ones, and no published ports (the edge serves the console and the data plane).
# The response cache's Valkey (gw-valkey) gets the demo's password too: the gateway's preflight,
# the store and the gateway must agree on it. The demo starts with the response cache on, while a
# gateway's own default is off. The load tests' agent and mock run too, with the demo's agent
# token: the console's load tests and pacod-benchmark share them.
services:
  gw-preflight:
    environment:
      GW_DB_PASSWORD: ${GW_DB_PASSWORD}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      PGW_VALKEY_PASSWORD: ${PGW_VALKEY_PASSWORD}
      PGW_KEK: ${PGW_KEK}
      PGW_KEK_ID: default
      PGW_KEY_PEPPER: ${PGW_KEY_PEPPER}
      PGW_INTERNAL_TOKEN: ${PGW_INTERNAL_TOKEN}
      PGW_ID_CLIENT_SECRET: ${PGW_ID_CLIENT_SECRET}
      PGW_UI_CLIENT_SECRET: ${PGW_UI_CLIENT_SECRET}
      PGW_UI_SESSION_SECRET: ${PGW_UI_SESSION_SECRET}
      TESTER_ID_CLIENT_SECRET: ${TESTER_ID_CLIENT_SECRET}
      TESTER_LOAD_TOKEN: ${TESTER_LOAD_TOKEN}

  gw-clickhouse:
    ports: !reset []
    environment:
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}

  gw-valkey:
    ports: !reset []
    environment:
      VALKEY_PASSWORD: ${PGW_VALKEY_PASSWORD}

  pacod-gw:
    ports: !reset []
    environment:
      # As in production: the development file keeps 0.0.0.0 for its port 18081, which the demo
      # does not publish, so the management API listens on pacod-admin-net alone.
      PGW_ADMIN_LISTEN: pacod-gw-admin:8081
      DATABASE_URL: postgres://pacod_gw:${GW_DB_PASSWORD}@pacod-postgres:5432/pacod_gw
      PGW_VALKEY_PASSWORD: ${PGW_VALKEY_PASSWORD}
      PGW_KEK: ${PGW_KEK}
      PGW_KEK_ID: default
      PGW_KEY_PEPPER: ${PGW_KEY_PEPPER}
      PGW_INTERNAL_TOKEN: ${PGW_INTERNAL_TOKEN}
      # With PGW_AUTH=oidc the first admin is pacod-id's bootstrap admin; no local admin.
      PGW_ADMIN_EMAIL: ""
      PGW_ADMIN_PASSWORD: ""
      # The development mock, and the load tests' mock (pacod-gw's tester, pacod-benchmark).
      PGW_EGRESS_ALLOW_PRIVATE: gw-mock,gw-load-mock
      # Tool servers and remote agents have their own list (organisation administrators name
      # them, not platform ones): ap-api, whose /mcp the bootstrap registers as the tool server
      # pacod-ap; and the two mocks, whose /mcp and /a2a gw-smoke and pacod-benchmark call.
      PGW_TOOL_EGRESS_ALLOW_PRIVATE: ap-api,gw-mock,gw-load-mock
      PGW_CONSOLE_URL: ${GW_CONSOLE_ORIGIN}
      PGW_ID_ISSUER: ${PACOD_ID_ISSUER}
      PGW_ID_CLIENT_SECRET: ${PGW_ID_CLIENT_SECRET}
      # Installs the response cache on for every workspace, on a new database only.
      PGW_CACHE_DEFAULT_MODE: enforce
      # pacod-broker (overlays/broker.yml): models it lists at the gateway's providers become
      # discovery proposals, templates may take pool members from it, and /mcp serves its two
      # discovery tools next to the approved tool servers' (pacod-gw runbook section 21.2). The
      # token (broker.consumer) comes from the bootstrap; until then the core leaves the broker be.
      PGW_BROKER_URL: http://pacod-broker:8060
      PGW_BROKER_TOKEN: ${PGW_BROKER_TOKEN:-}
      # pacod-aggregator (overlays/agg.yml): the daily sync of model data. The bootstrap makes the
      # token (agg.consumer); until then a sync is refused, and the models keep their prices.
      PGW_AGGREGATOR_URL: http://pacod-aggregator:8150
      PGW_AGGREGATOR_TOKEN: ${PGW_AGGREGATOR_TOKEN:-}
    depends_on:
      pacod-id:
        condition: service_healthy

  gw-analytics:
    ports: !reset []
    environment:
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      PGW_INTERNAL_TOKEN: ${PGW_INTERNAL_TOKEN}
      PGW_EGRESS_ALLOW_PRIVATE: gw-mock,gw-load-mock

  gw-console:
    environment:
      GRAFANA_URL: ${GRAFANA_ORIGIN}/
      PGW_ID_ISSUER: ${PACOD_ID_ISSUER}
      PGW_UI_CLIENT_SECRET: ${PGW_UI_CLIENT_SECRET}
      PGW_UI_SESSION_SECRET: ${PGW_UI_SESSION_SECRET}
      PGW_CONSOLE_URL: ${GW_CONSOLE_ORIGIN}
      # The Benchmarks page links to pacod-benchmark.
      BENCH_URL: ${BENCH_ORIGIN}

  gw-tester:
    ports: !reset []
    environment:
      TESTER_ID_CLIENT_SECRET: ${TESTER_ID_CLIENT_SECRET}
      # The stack's one agent; the development file also names one on another machine.
      TESTER_LOAD_AGENTS: local=http://gw-load-agent:8096
      TESTER_LOAD_TOKEN: ${TESTER_LOAD_TOKEN}

  gw-mock:
    ports: !reset []

  # The load tests' agent and mock (pacod-gw's docker-compose.load*.yml), with the demo's agent
  # token instead of the development one; pacod-benchmark drives the same agent (overlays/bench.yml).
  gw-load-agent:
    ports: !reset []
    environment:
      LOAD_AGENT_TOKEN: ${TESTER_LOAD_TOKEN}

  gw-load-mock:
    ports: !reset []

  # The bridge to pacod-broker (pacod-gw's profile broker): it announces the templates and models
  # offered on the broker, keeps their live state, and reports how calls went. Its tokens and its file come
  # from the bootstrap (scripts/bootstrap.py), so scripts/render-env.sh turns the profile on only
  # once they are there. It runs as the user who runs make, who owns the file and the token files
  # (0600) under .state/broker.
  gw-broker:
    ports: !reset []
    user: "${DEMO_UID}:${DEMO_GID}"
    volumes: !override
      - ${DEMO_STATE}/broker:/etc/gw-broker:ro
    environment:
      RUST_LOG: ${DEMO_LOG_LEVEL}
      GWB_LOG_FORMAT: ${DEMO_LOG_FORMAT}
      GWB_GW_TOKEN: ${GWB_GW_TOKEN:-}
      GWB_CONSUMER_TOKEN: ${GWB_CONSUMER_TOKEN:-}
      GWB_PUBLIC_URL: ${GW_API_ORIGIN}
      GWB_OBTAIN_URL: ${GW_CONSOLE_ORIGIN}
    depends_on:
      pacod-broker:
        condition: service_healthy
