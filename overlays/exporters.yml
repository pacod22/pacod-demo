# Adapts pacod-ap's exporters (../pacod-ap/monitoring/docker-compose.exporters.yml) to the full
# stack: the platform's (PostgreSQL, the host, the containers) and the app's (pgbouncer, Redis),
# all scraped by the one pacod-prometheus, none published.
services:
  pacod-postgres-exporter:
    ports: !reset []
  # The app's two only while pacod-ap runs (demo.env's DEMO_PRODUCTS: scripts/render-env.sh turns
  # the profile ap on): without its pgbouncer the first one exits, and restarts for ever.
  ap-pgbouncer-exporter:
    profiles: [ap]
    ports: !reset []
  ap-redis-exporter:
    profiles: [ap]
    ports: !reset []
  pacod-node-exporter:
    ports: !reset []
  pacod-cadvisor:
    ports: !reset []
