# Adapts pacod-kb's app file (../pacod-kb/docker-compose.yml) to the full stack: the shared
# PostgreSQL, Qdrant, embeddings service, pacod-id and gateway (their addresses and the kb
# settings come from .state/env/kb.env), named volumes instead of /data paths, and no
# published ports (the edge serves the UI).
#
# pacod-broker: kb's compose file reads BROKER_URL and BROKER_TOKEN from compose's variables, which
# in the stack are pacod-ap's (stack.env, for ap-api). kb gets its own: KB_BROKER_TOKEN, a pacod-id
# service account holding broker.consumer only (scripts/bootstrap.py), as kb only reads the broker.
# DEMO_BROKER_URL and DEMO_BROKER_TOKEN (demo.env) replace both. Blank until the bootstrap has made it (the Broker page then reports the broker's refusal).
services:
  kb-pipeline:
    environment:
      BROKER_URL: ${DEMO_BROKER_URL}
      BROKER_TOKEN: ${DEMO_BROKER_TOKEN:-${KB_BROKER_TOKEN:-}}
    depends_on:
      pacod-embeddings:
        condition: service_healthy

  kb-ui:
    ports: !reset []
