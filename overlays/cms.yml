# Adapts pacod-cms's app file (../pacod-cms/docker-compose.yml) to the full stack: sign-in
# through the shared pacod-id, AI through the shared gateway, the website files under the demo's
# .state/ instead of the cms checkout, and no published ports (the edge serves the studio and the
# websites).
services:
  cms-mongo:
    # MongoDB 8.x refuses to start on Linux 6.19 through 7.0.13, and Docker Desktop's VM runs
    # 7.0.0 (SERVER-121912). 7.0 is not affected; it cannot open data written by 8.x, so the
    # cms-mongo-data volume must start empty. Drop this once the VM's kernel is 7.0.14 or newer.
    image: mongo:7.0.45
    ports: !reset []

  cms-site:
    # As the user who runs make, not the image's own (uid 100): on Linux that one cannot write the
    # log directory render-env.sh made, nor the studio the website files below, where every demo
    # picture failed and with it every demo article. The files stay that user's (make clean).
    user: "${DEMO_UID}:${DEMO_GID}"
    ports: !reset []
    environment:
      SITE_PUBLIC_SCHEME: ${DEMO_URL_SCHEME}
      SITE_PUBLIC_PORT: ${DEMO_URL_PORT}

  cms-studio:
    user: "${DEMO_UID}:${DEMO_GID}"
    ports: !reset []
    environment:
      SITE_PUBLIC_SCHEME: ${DEMO_URL_SCHEME}
      SITE_PUBLIC_PORT: ${DEMO_URL_PORT}
      # Over HTTPS the studio's two cookies are __Host- ones, as in pacod-cms's prod profile
      # (application-prod.properties): no other host -- a website on a sibling subdomain included
      # (DEMO_SITE_DOMAIN_SHARED) -- can set them. The dev profile the demo runs leaves them plain.
      PACOD_STUDIO_HOST_COOKIES: ${CMS_HOST_COOKIES}
      SERVER_SERVLET_SESSION_COOKIE_NAME: ${CMS_SESSION_COOKIE}
      SERVER_SERVLET_SESSION_COOKIE_SECURE: ${CMS_HOST_COOKIES}
      SERVER_SERVLET_SESSION_COOKIE_PATH: /
      SERVER_SERVLET_SESSION_COOKIE_SAME_SITE: lax
    depends_on:
      pacod-id:
        condition: service_healthy
