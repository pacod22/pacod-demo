# Adapts pacod-aggregator's app file (../pacod-aggregator/deploy/docker-compose.yml) to the full
# stack: the server and its console sign in through the shared pacod-id (AGG_AUTH=oidc) and take the
# demo's secrets and log level. The app file publishes no ports (the edge serves the catalogue and
# the console) and carries its own builds.
#
# The admin and internal API stay on pacod-admin-net under the alias pacod-aggregator-admin
# (docs/NETWORK.md): the console and the scraper reach it there, nothing else does. agg-browser is
# on agg-browser-net alone, so a page it renders reaches nothing but the scraper's egress proxy.
#
# The model that reads the vendors' pages is not set here: scripts/render-env.sh writes AGG_LLM_URL
# and AGG_LLM_KEY to .state/env/agg.env, and the app file reads them. They are the gateway and
# AGG_GW_KEY, the aggregator's key there, which the bootstrap makes (make up recreates the server
# then), unless demo.env names an endpoint of its own. Until there is a key and a model, named in
# demo.env or the console's Settings, pages are fetched but not read: the catalogue holds what the
# lists say.
services:
  pacod-aggregator:
    environment:
      RUST_LOG: ${DEMO_LOG_LEVEL},sqlx=warn
      AGG_LOG_FORMAT: ${DEMO_LOG_FORMAT}
      AGG_AUTH: oidc
      AGG_ID_ISSUER: ${PACOD_ID_ISSUER}
      AGG_ID_CLIENT_SECRET: ${AGG_ID_CLIENT_SECRET}
      AGG_INTERNAL_TOKEN: ${AGG_INTERNAL_TOKEN}
      AGG_PUBLIC_URL: ${AGG_API_ORIGIN}
    depends_on:
      pacod-id:
        condition: service_healthy

  agg-scraper:
    environment:
      RUST_LOG: ${DEMO_LOG_LEVEL}
      AGG_LOG_FORMAT: ${DEMO_LOG_FORMAT}
      AGG_INTERNAL_TOKEN: ${AGG_INTERNAL_TOKEN}

  agg-console:
    environment:
      AGG_CONSOLE_URL: ${AGG_CONSOLE_URL}
      AGG_ID_ISSUER: ${PACOD_ID_ISSUER}
      AGG_UI_CLIENT_SECRET: ${AGG_UI_CLIENT_SECRET}
      AGG_UI_SESSION_SECRET: ${AGG_UI_SESSION_SECRET}
