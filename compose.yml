# The pacod full stack on one machine: one compose project made of the seven repositories' own
# compose files (their "app files"), a small overlay per repository, and the shared layer
# (platform.yml). Run it with `make up`, not by hand: the Makefile generates the secrets and the
# env files under .state/ that every include below reads.
#
# Every container is on the external network pacod-net and has a name that is unique across
# the repositories (docs/NETWORK.md), which is what lets these files be put together unchanged.
# The listeners only servers reach, and their callers, are on pacod-admin-net as well.
#
# The stack runs from a copy of this file, .state/compose.yml, which scripts/render-env.sh makes
# without the blocks of the products demo.env's DEMO_PRODUCTS leaves out: keep one include per
# block, blocks apart by a blank line, and overlays/<product>.yml an item of a product's path list,
# on a line of its own. Blocks without one (the shared layer), id's and exporters' are always kept.
name: pacod-demo

include:
  # pacod-id: identity, one realm for every product (config/pacod-id.toml).
  - path:
      - ../pacod-id/deploy/compose/docker-compose.yml
      - overlays/id.yml
    env_file: [.state/env/stack.env, .state/env/id.env]

  # pacod-gw: the gateway (core, analytics, console, tester, ClickHouse), its mock provider, and
  # the load agent and load mock of its load tests (docker-compose.load*.yml), which
  # pacod-benchmark drives too.
  - path:
      - ../pacod-gw/deploy/docker-compose.yml
      - ../pacod-gw/deploy/docker-compose.dev.yml
      - ../pacod-gw/deploy/docker-compose.load.yml
      - ../pacod-gw/deploy/docker-compose.load.dev.yml
      - overlays/gw.yml
    env_file: [.state/env/stack.env, .state/env/gw.env]

  # pacod-ap: the agent platform (API, admin API, workers, frontend) and the shared embeddings.
  - path:
      - ../pacod-ap/pacod-api/docker-compose.yml
      - ../pacod-ap/pacod-api/docker-compose.local.yml
      - overlays/ap.yml
    env_file: [.state/env/stack.env, .state/env/ap.env]

  # The exporters pacod-ap ships with its monitoring: the platform's and the app's.
  - path:
      - ../pacod-ap/monitoring/docker-compose.exporters.yml
      - overlays/exporters.yml
    env_file: [.state/env/stack.env, .state/env/ap.env]

  # pacod-cms: the websites, the studio, MongoDB and the PDF renderer.
  - path:
      - ../pacod-cms/docker-compose.yml
      - overlays/cms.yml
    env_file: [.state/env/stack.env, .state/env/cms.env]

  # pacod-kb: the knowledge base's pipeline and UI.
  - path:
      - ../pacod-kb/docker-compose.yml
      - overlays/kb.yml
    env_file: [.state/env/stack.env, .state/env/kb.env]

  # pacod-benchmark: benchmarks of the gateway (API, UI), on the gateway's load agent and mock.
  - path:
      - ../pacod-benchmark/docker-compose.yml
      - overlays/bench.yml
    env_file: [.state/env/stack.env, .state/env/bench.env]

  # pacod-broker: the discovery broker (API, admin API, console). No database: its state is a
  # volume. pacod-gw's bridge to it, gw-broker, is in overlays/gw.yml.
  - path:
      - ../pacod-broker/deploy/docker-compose.yml
      - overlays/broker.yml
    env_file: [.state/env/stack.env, .state/env/broker.env]

  # pacod-aggregator: model data from the vendors' own pages (server, scraper, browser, console),
  # which pacod-gw's core syncs daily.
  - path:
      - ../pacod-aggregator/deploy/docker-compose.yml
      - overlays/agg.yml
    env_file: [.state/env/stack.env, .state/env/agg.env]

  # The shared layer: one PostgreSQL, Qdrant, mail sink, edge and monitoring stack.
  - path: platform.yml
    env_file: [.state/env/stack.env]
